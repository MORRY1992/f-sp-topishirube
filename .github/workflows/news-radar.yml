name: Official news radar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-radar.yml'
      - 'scripts/collect.py'
      - 'scripts/editorial_queue.py'
      - 'scripts/report_radar.py'
      - 'content/sources.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: news-radar
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check collection and editorial safeguards
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Collect official source candidates (no publication)
        shell: bash
        run: |
          if git fetch origin refs/heads/data:refs/remotes/origin/data --depth=1; then
            git show FETCH_HEAD:queue.json > "$RUNNER_TEMP/previous.json"
          fi
          set +e
          python scripts/collect.py --output "$RUNNER_TEMP/queue.json" --previous "$RUNNER_TEMP/previous.json"
          result=$?
          set -e
          echo "RADAR_RESULT=$result" >> "$GITHUB_ENV"
      - name: Prepare editing worklist and explicit source health
        run: |
          python scripts/editorial_queue.py --queue "$RUNNER_TEMP/queue.json" --output "$RUNNER_TEMP/editorial.json"
          cp scripts/report_radar.py "$RUNNER_TEMP/report_radar.py"
      - name: Save bounded queue on isolated data branch
        shell: bash
        run: |
          git config user.name 'Topishirube radar'
          git config user.email 'topishirube-radar@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git switch -C data refs/remotes/origin/data
          else
            git switch --orphan data
          fi
          cp "$RUNNER_TEMP/queue.json" queue.json
          cp "$RUNNER_TEMP/editorial.json" editorial.json
          git add queue.json editorial.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official news candidates (not articles)'
            git push origin HEAD:data
          fi
      - name: Report source availability
        shell: bash
        run: |
          python "$RUNNER_TEMP/report_radar.py" --queue queue.json --editorial editorial.json --collector-result "$RADAR_RESULT" --summary "$GITHUB_STEP_SUMMARY"
